<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Fondo WebGL Nodos</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
  // Escena, cámara y renderer
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Fondo estático
  const loader = new THREE.TextureLoader();
  loader.load('a_high_resolution_abstract_scientific_tech_network.png', function(texture){
    scene.background = texture;
  });

  // Crear nodos animados
  const nodeCount = 150;
  const nodes = [];
  const geometry = new THREE.SphereGeometry(0.05, 8, 8);
  const material = new THREE.MeshBasicMaterial({color: 0xff0000});

  for(let i=0;i<nodeCount;i++){
    const node = new THREE.Mesh(geometry, material);
    node.position.x = (Math.random()-0.5)*10;
    node.position.y = (Math.random()-0.5)*6;
    node.position.z = (Math.random()-0.5)*10;
    scene.add(node);
    nodes.push({mesh: node, speed: Math.random()*0.01 + 0.002});
  }

  camera.position.z = 8;

  // Animación
  function animate() {
    requestAnimationFrame(animate);
    nodes.forEach(n => {
      n.mesh.rotation.x += n.speed;
      n.mesh.rotation.y += n.speed;
    });
    renderer.render(scene, camera);
  }

  animate();

  // Ajustar al cambiar tamaño de pantalla
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
